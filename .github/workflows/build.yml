name: Build and Test CV

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Run tests
        run: python tests/test_utils.py
        continue-on-error: false

      - name: Compile LaTeX to PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv.tex
          latexmk_use_xelatex: false
          latexmk_shell_escape: false

      - name: Generate JSON Resume
        run: python scripts/generate_json.py

      - name: Prepare docs folder for Vercel
        run: |
          mkdir -p docs
          cp cv.pdf docs/index.pdf

      - name: Verify generated files
        run: |
          echo "Verifying generated files..."
          ls -lh cv.pdf docs/index.pdf docs/resume.json
          # Sanity-check JSON is not missing roles / has clean project names
          python - <<'PY'
          import json, sys
          with open("docs/resume.json", encoding="utf-8") as f:
              data = json.load(f)
          work = data.get("work") or []
          projects = data.get("projects") or []
          edu = data.get("education") or []
          assert len(work) >= 2, f"expected >=2 work entries, got {len(work)}"
          assert all("\\href" not in (p.get("name") or "") for p in projects), "project names still contain LaTeX"
          assert any((p.get("url") or "").startswith("http") for p in projects), "expected at least one project URL"
          assert edu and "8.4" in (edu[0].get("score") or ""), f"unexpected education score: {edu}"
          print(f"✓ JSON sanity OK ({len(work)} jobs, {len(projects)} projects)")
          PY
          echo "✓ All files generated successfully"

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdf
          path: cv.pdf
          retention-days: 90

      - name: Upload all formats artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-all-formats
          path: docs/
          retention-days: 90
